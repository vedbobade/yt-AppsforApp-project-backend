apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: yt-project-appsforapp-ns

spec: 
  replicas: 1
  selector:
    matchLabels:
      app: be
  
  template:
    metadata:
      labels:
        app: be
  

    spec:
      containers:
        - name: backend-docker-image
          image: vedbobade/appsforapp-yt-project-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
